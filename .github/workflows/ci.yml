name: Registry CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Validate local registry contract
        run: node scripts/validate-registry.mjs
      - name: Test UI source contracts
        run: node scripts/test-ui-contract.mjs
      - name: Install runtime test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test UI runtime behavior and accessibility
        run: npm test
      - name: Validate current ref with official shadcn CLI
        run: npx --yes shadcn@latest registry validate "Acongm/shadcn-ui#${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
      - name: Validate declared stable ref
        run: |
          STABLE_REF="$(node -p "require('./stable.json').ref")"
          npx --yes shadcn@latest registry validate "Acongm/shadcn-ui#${STABLE_REF}"
