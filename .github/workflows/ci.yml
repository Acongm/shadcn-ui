name: Registry CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Validate local registry contract
        run: node scripts/validate-registry.mjs
      - name: Validate pinned upstream references
        run: node scripts/validate-references.mjs
      - name: Test UI source contracts
        run: node scripts/test-ui-contract.mjs
      - name: Install locked runtime test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck public component contracts
        run: npm run types:check
      - name: Test UI runtime behavior and accessibility
        run: npm test
      - name: Validate with official shadcn CLI
        run: npx --yes shadcn@latest registry validate "Acongm/shadcn-ui#${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
