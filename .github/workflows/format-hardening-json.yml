name: Format hardening manifests

on:
  push:
    branches:
      - agent/core-reference-hardening-v2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/core-reference-hardening-v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Format JSON manifests
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const file of ['registry.json', 'references/components.json']) {
            const value = JSON.parse(fs.readFileSync(file, 'utf8'));
            fs.writeFileSync(file, `${JSON.stringify(value, null, 2)}\n`);
          }
          NODE
      - name: Commit formatting
        run: |
          if git diff --quiet -- registry.json references/components.json; then
            echo "JSON manifests are already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry.json references/components.json
          git commit -m "style(core): format Registry reference manifests"
          git push origin HEAD:agent/core-reference-hardening-v2
