name: Update hardening v2 lockfile

on:
  push:
    branches:
      - agent/core-reference-hardening-v2

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/core-reference-hardening-v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Generate package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "test(core): lock reference-aligned dependency graph"
          git push origin HEAD:agent/core-reference-hardening-v2
